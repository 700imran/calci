<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST Calculator</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<div class="calculator">

    <h1>GST Calculator</h1>

    <div class="form-group">
        <label>Calculation Type</label>
        <select id="type">
            <option value="exclusive">Add GST</option>
            <option value="inclusive">Remove GST</option>
        </select>
    </div>

    <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="Enter amount">
    </div>

    <div class="form-group">
        <label>GST Rate</label>
        <select id="gst">
            <option value="5">5%</option>
            <option value="12">12%</option>
            <option value="18" selected>18%</option>
            <option value="28">28%</option>
        </select>
    </div>

    <button onclick="calculateGST()">Calculate GST</button>

    <div class="result" id="result">
        <p><span>Base Amount</span><strong>₹0.00</strong></p>
        <p><span>GST Amount</span><strong>₹0.00</strong></p>
        <p><span>Total Amount</span><strong>₹0.00</strong></p>
    </div>

</div>

<script>
function calculateGST(){

    const amount = parseFloat(
        document.getElementById('amount').value
    ) || 0;

    const gstRate = parseFloat(
        document.getElementById('gst').value
    );

    const type =
        document.getElementById('type').value;

    let baseAmount = 0;
    let gstAmount = 0;
    let totalAmount = 0;

    if(type === 'exclusive'){

        gstAmount = amount * gstRate / 100;
        totalAmount = amount + gstAmount;
        baseAmount = amount;

    }else{

        baseAmount =
            amount / (1 + gstRate/100);

        gstAmount =
            amount - baseAmount;

        totalAmount = amount;
    }

    document.getElementById('result').innerHTML = `
        <p>
            <span>Base Amount</span>
            <strong>₹${baseAmount.toFixed(2)}</strong>
        </p>

        <p>
            <span>GST Amount</span>
            <strong>₹${gstAmount.toFixed(2)}</strong>
        </p>

        <p>
            <span>Total Amount</span>
            <strong>₹${totalAmount.toFixed(2)}</strong>
        </p>
    `;
}
</script>

</body>
</html>
