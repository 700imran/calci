<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIP Calculator - Mutual Fund, Stocks & Index Fund Returns</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>SIP Calculator</h1>

    <p class="subtitle">
        Calculate Mutual Fund, Index Fund, Gold ETF, FD and Stock SIP Returns
    </p>

    <div class="calculator">

        <div class="grid">

            <div class="form-group">
                <label>Monthly Investment (₹)</label>
                <input type="number" id="sipAmount" value="5000">
            </div>

            <div class="form-group">
                <label>Investment Period (Years)</label>
                <input type="number" id="years" value="10">
            </div>

            <div class="form-group">
                <label>Investment Type</label>

                <select id="investmentType">

                    <option value="3">Savings Account (3%)</option>
                    <option value="6.5">Fixed Deposit (6.5%)</option>
                    <option value="7.5">Debt Fund (7.5%)</option>
                    <option value="10">Hybrid Fund (10%)</option>
                    <option value="12" selected>Index Fund (12%)</option>
                    <option value="12">Large Cap Fund (12%)</option>
                    <option value="13">Flexi Cap Fund (13%)</option>
                    <option value="15">Mid Cap Fund (15%)</option>
                    <option value="18">Small Cap Fund (18%)</option>
                    <option value="8">Gold ETF (8%)</option>
                    <option value="12">Stocks Conservative (12%)</option>
                    <option value="15">Stocks Moderate (15%)</option>
                    <option value="20">Stocks Aggressive (20%)</option>
                    <option value="custom">Custom Return</option>

                </select>
            </div>

            <div class="form-group hidden" id="customBox">
                <label>Custom Return (%)</label>
                <input type="number" id="customReturn" value="12">
            </div>

        </div>

        <button onclick="calculateSIP()">
            Calculate SIP Returns
        </button>

    </div>

    <div class="results">

        <div class="result-card">
            <h3>Total Investment</h3>
            <p id="investmentValue">₹0</p>
        </div>

        <div class="result-card">
            <h3>Estimated Wealth</h3>
            <p id="wealthValue">₹0</p>
        </div>

        <div class="result-card">
            <h3>Total Gains</h3>
            <p class="green" id="gainValue">₹0</p>
        </div>

    </div>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Year</th>
                    <th>Invested</th>
                    <th>Estimated Value</th>
                </tr>
            </thead>

            <tbody id="yearlyTable">
            </tbody>

        </table>

    </div>

</div>

<script>

const typeSelect =
document.getElementById('investmentType');

typeSelect.addEventListener('change',()=>{

    const customBox =
    document.getElementById('customBox');

    if(typeSelect.value === 'custom'){
        customBox.classList.remove('hidden');
    }else{
        customBox.classList.add('hidden');
    }
});

function formatMoney(num){

    return '₹' +
    Math.round(num)
    .toLocaleString('en-IN');
}

function calculateSIP(){

    const sip =
    parseFloat(
    document.getElementById('sipAmount').value);

    const years =
    parseFloat(
    document.getElementById('years').value);

    let annualReturn;

    if(typeSelect.value === 'custom'){

        annualReturn =
        parseFloat(
        document.getElementById('customReturn').value);

    }else{

        annualReturn =
        parseFloat(typeSelect.value);
    }

    const months = years * 12;

    const monthlyRate =
    annualReturn / 12 / 100;

    const futureValue =
    sip *
    (
        (
            Math.pow(
                1 + monthlyRate,
                months
            ) - 1
        )
        /
        monthlyRate
    )
    *
    (1 + monthlyRate);

    const totalInvestment =
    sip * months;

    const gain =
    futureValue - totalInvestment;

    document.getElementById(
    'investmentValue'
    ).innerText =
    formatMoney(totalInvestment);

    document.getElementById(
    'wealthValue'
    ).innerText =
    formatMoney(futureValue);

    document.getElementById(
    'gainValue'
    ).innerText =
    formatMoney(gain);

    createYearlyTable(
        sip,
        annualReturn,
        years
    );
}

function createYearlyTable(
    sip,
    annualReturn,
    years
){

    const table =
    document.getElementById(
    'yearlyTable'
    );

    table.innerHTML = '';

    const monthlyRate =
    annualReturn / 12 / 100;

    for(let year=1; year<=years; year++){

        const months = year * 12;

        const invested =
        sip * months;

        const value =
        sip *
        (
            (
                Math.pow(
                    1 + monthlyRate,
                    months
                ) - 1
            )
            /
            monthlyRate
        )
        *
        (1 + monthlyRate);

        table.innerHTML += `
        <tr>
            <td>${year}</td>
            <td>${formatMoney(invested)}</td>
            <td>${formatMoney(value)}</td>
        </tr>
        `;
    }
}

calculateSIP();

</script>

</body>
</html>
